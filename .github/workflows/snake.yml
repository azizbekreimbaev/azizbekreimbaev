name: Generate Snake Animation

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

  push:
    branches:
      - main


permissions:
  contents: write


jobs:

  generate-snake:

    runs-on: ubuntu-latest

    timeout-minutes: 10

    steps:

      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3

        with:

          github_user_name: ${{ github.repository_owner }}

          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#F7317F&color_dots=#161B22,#00D9FF,#7F00FF,#F7317F,#FFFFFF
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#F7317F


      - name: Publish Snake
        uses: crazy-max/ghaction-github-pages@v5

        with:

          target_branch: output-snake

          build_dir: dist

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
