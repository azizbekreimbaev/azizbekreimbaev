name: Generate Pac-Man Animation

on:
  workflow_dispatch:

  schedule:
    - cron: "30 0 * * *"

  push:
    branches:
      - main


permissions:
  contents: write


jobs:

  generate-pacman:

    runs-on: ubuntu-latest

    timeout-minutes: 20

    steps:

      - name: Generate Pac-Man SVG
        uses: abozanona/pacman-contribution-graph@v5.0.0

        with:

          github_user_name: ${{ github.repository_owner }}

          github_token: ${{ secrets.GITHUB_TOKEN }}

          games: "pacman"

          player_style: "opportunistic"

          hide_month_labels: "false"


      - name: Publish Pac-Man
        uses: crazy-max/ghaction-github-pages@v5

        with:

          target_branch: output-pacman

          build_dir: dist

        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
