<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 720"
  role="img"
  aria-labelledby="title desc"
>

  <title id="title">
    Azozbek Kevin 3D Neural Developer Brain
  </title>

  <desc id="desc">
    Animated 3D holographic neural developer brain representing
    Full Stack Development, AI, Robotics and NVIDIA Isaac Sim.
  </desc>

  <defs>

    <!-- ================= GRADIENTS ================= -->

    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="30%" stop-color="#00A8FF"/>
      <stop offset="55%" stop-color="#F7317F"/>
      <stop offset="80%" stop-color="#9D00FF"/>
      <stop offset="100%" stop-color="#5200FF"/>
    </linearGradient>

    <linearGradient id="depthGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001D35"/>
      <stop offset="50%" stop-color="#2B0646"/>
      <stop offset="100%" stop-color="#10002B"/>
    </linearGradient>

    <radialGradient id="coreGradient">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="18%" stop-color="#00E5FF"/>
      <stop offset="48%" stop-color="#F7317F"/>
      <stop offset="100%" stop-color="#5200FF"/>
    </radialGradient>

    <radialGradient id="brainFill">
      <stop offset="0%" stop-color="#15223A"/>
      <stop offset="65%" stop-color="#090D19"/>
      <stop offset="100%" stop-color="#03050B"/>
    </radialGradient>

    <!-- ================= FILTERS ================= -->

    <filter id="strongGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shadow3d" x="-50%" y="-50%" width="220%" height="220%">
      <feDropShadow
        dx="18"
        dy="22"
        stdDeviation="12"
        flood-color="#000000"
        flood-opacity=".85"
      />
      <feDropShadow
        dx="-7"
        dy="-7"
        stdDeviation="8"
        flood-color="#00E5FF"
        flood-opacity=".22"
      />
    </filter>

    <!-- ================= CSS ================= -->

    <style>

      .brain-back-3 {
        fill: none;
        stroke: #210044;
        stroke-width: 12;
        opacity: .28;
      }

      .brain-back-2 {
        fill: none;
        stroke: #4B007E;
        stroke-width: 9;
        opacity: .35;
      }

      .brain-back-1 {
        fill: none;
        stroke: #007B9E;
        stroke-width: 7;
        opacity: .38;
      }

      .brain-front {
        fill: url(#brainFill);
        fill-opacity: .83;

        stroke: url(#mainGradient);
        stroke-width: 5;

        stroke-linejoin: round;
        stroke-linecap: round;

        filter: url(#shadow3d);

        stroke-dasharray: 22 12;

        animation:
          outlineMove 10s linear infinite,
          brainFloat 5s ease-in-out infinite;
      }

      .brain-inner {
        fill: none;

        stroke: url(#mainGradient);
        stroke-width: 2.2;

        opacity: .52;

        stroke-dasharray: 5 12;

        animation: signalFlow 5s linear infinite;
      }

      .wire {
        fill: none;

        stroke: url(#mainGradient);
        stroke-width: 2.2;

        opacity: .72;

        stroke-dasharray: 7 11;

        animation: signalFlow 4s linear infinite;
      }

      .wire.fast {
        animation-duration: 2.8s;
      }

      .wire.slow {
        animation-duration: 7s;
        opacity: .45;
      }

      .node {
        fill: url(#coreGradient);
        stroke: #FFFFFF;
        stroke-width: 1.4;

        filter: url(#strongGlow);

        transform-box: fill-box;
        transform-origin: center;

        animation:
          nodePulse 2.4s ease-in-out infinite,
          nodeFloat 4s ease-in-out infinite;
      }

      .n2 { animation-delay: -.4s; }
      .n3 { animation-delay: -.8s; }
      .n4 { animation-delay: -1.2s; }
      .n5 { animation-delay: -1.6s; }
      .n6 { animation-delay: -2s; }

      .orbit {
        fill: none;

        stroke: url(#mainGradient);
        stroke-width: 1.7;

        opacity: .40;

        stroke-dasharray: 7 16;

        transform-origin: 600px 340px;

        animation: orbitSpin 12s linear infinite;
      }

      .orbit.two {
        animation-duration: 17s;
        animation-direction: reverse;
        opacity: .27;
      }

      .orbit.three {
        animation-duration: 22s;
        opacity: .20;
      }

      .core-shell {
        fill: #060913;
        fill-opacity: .96;

        stroke: url(#mainGradient);
        stroke-width: 4;

        filter: url(#strongGlow);

        transform-box: fill-box;
        transform-origin: center;

        animation: coreBreathe 3s ease-in-out infinite;
      }

      .core-ring {
        fill: none;

        stroke: #00E5FF;
        stroke-width: 2;

        opacity: .52;

        stroke-dasharray: 8 12;

        transform-origin: 600px 340px;

        animation: orbitSpin 7s linear infinite;
      }

      .core-ring.pink {
        stroke: #F7317F;
        animation-direction: reverse;
        animation-duration: 9s;
      }

      .title {
        font-family:
          ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          monospace;

        font-size: 30px;
        font-weight: 900;

        fill: #FFFFFF;

        paint-order: stroke;
        stroke: #050711;
        stroke-width: 5px;
        stroke-linejoin: round;
      }

      .subtitle {
        font-family:
          ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          monospace;

        font-size: 14px;
        font-weight: 800;

        fill: #00E5FF;

        letter-spacing: 2.4px;
      }

      .mindset {
        font-family:
          ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          monospace;

        font-size: 12px;
        font-weight: 700;

        fill: #D6E2FF;
      }

      .tech-title {
        font-family:
          ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          monospace;

        font-size: 21px;
        font-weight: 900;

        fill: #FFFFFF;

        paint-order: stroke;
        stroke: #060913;
        stroke-width: 5px;
      }

      .tech-sub {
        font-family:
          ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          monospace;

        font-size: 14px;
        font-weight: 700;

        fill: #B9C9E8;
      }

      .scanner {
        stroke: #00E5FF;
        stroke-width: 2;

        opacity: 0;

        filter: url(#softGlow);

        animation: scannerMove 5s ease-in-out infinite;
      }

      .scanner.pink {
        stroke: #F7317F;
        animation-delay: -2.5s;
      }

      .particle {
        fill: #FFFFFF;
        filter: url(#strongGlow);

        animation: particlePulse 2s ease-in-out infinite;
      }

      .p2 { animation-delay: -.5s; }
      .p3 { animation-delay: -1s; }
      .p4 { animation-delay: -1.5s; }


      @keyframes outlineMove {
        to {
          stroke-dashoffset: -400;
        }
      }


      @keyframes signalFlow {
        to {
          stroke-dashoffset: -180;
        }
      }


      @keyframes brainFloat {

        0%, 100% {
          transform: translateY(0px);
        }

        50% {
          transform: translateY(-8px);
        }

      }


      @keyframes nodePulse {

        0%, 100% {
          transform: scale(.80);
          opacity: .65;
        }

        50% {
          transform: scale(1.45);
          opacity: 1;
        }

      }


      @keyframes nodeFloat {

        0%, 100% {
          translate: 0 0;
        }

        50% {
          translate: 0 -5px;
        }

      }


      @keyframes coreBreathe {

        0%, 100% {
          transform: scale(.96);
        }

        50% {
          transform: scale(1.035);
        }

      }


      @keyframes orbitSpin {

        from {
          transform: rotate(0deg);
        }

        to {
          transform: rotate(360deg);
        }

      }


      @keyframes scannerMove {

        0%, 100% {
          transform: translateY(-220px);
          opacity: 0;
        }

        12% {
          opacity: .75;
        }

        50% {
          opacity: .42;
        }

        88% {
          opacity: .75;
        }

        96% {
          transform: translateY(250px);
          opacity: 0;
        }

      }


      @keyframes particlePulse {

        0%, 100% {
          opacity: .20;
        }

        50% {
          opacity: 1;
        }

      }


      @media (prefers-reduced-motion: reduce) {

        * {
          animation: none !important;
        }

      }

    </style>

  </defs>


